# Fallback release on EAS (manual only). Tag pushes now build on GitHub Actions
# (.github/workflows/release-android.yml), which skips Expo's free-tier queue.
#
# Manual run:  eas workflow:run release-android.yml
#
# If you switch back to EAS for good: its remote versionCode counter is far behind
# GitHub's (1.0.9 -> 10009), so first run `eas build:version:set -p android`.
name: Release Android

jobs:
  build_android:
    name: Build Android (production)
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Google Play (internal)
    needs: [build_android]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}
